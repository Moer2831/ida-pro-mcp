name: unit-tests

# 不需要 IDA 的测试与基准：fork 上也能跑（idalib-tests 需要 Hex-Rays 私有镜像，
# 因此那份 workflow 只在拥有镜像权限的仓库里生效）。
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable, no IDA required)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "jsonschema>=4.0"

      - name: Run test suite (IDA-free)
        working-directory: tests
        run: python -m unittest discover -s . -p "test_*.py" -v

      - name: Cache layer benchmark + peak-memory gate
        # 门禁：分块写入的 Python 峰值内存必须低于该上限（防止"整库物化"回潮）
        run: python -m ida_pro_mcp.benchmark --rows 120000 --legacy --assert-peak-mb 64
